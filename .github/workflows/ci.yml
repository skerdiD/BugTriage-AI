name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bugtriage_ai
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: bugtriage-private
      GOOGLE_GENERATIVE_AI_API_KEY: test-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      ARCJET_KEY: ajkey_test_ci_placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        if: ${{ hashFiles('vitest.config.ts', 'tests/**/*.test.ts') != '' }}
        run: npm run test:unit

      - name: Install Playwright browsers
        if: ${{ hashFiles('playwright.config.ts', 'tests/e2e/**/*.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke test
        if: ${{ hashFiles('playwright.config.ts', 'tests/e2e/**/*.spec.ts') != '' }}
        run: npm run test:e2e -- --grep "dashboard route is protected or accessible when authenticated"

      - name: Run production build
        run: npm run build
