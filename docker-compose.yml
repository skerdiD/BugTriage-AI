# Compose interpolation reads .env by default. If using .env.local, also pass
# --env-file .env.local to every Compose command (including build).
x-runtime-environment: &runtime-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env or pass --env-file .env.local}
  DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:?Set DATABASE_URL}}
  REDIS_URL: redis://redis:6379
  REDIS_ALLOW_INSECURE_CONNECTION: "true"

x-runtime-env-files: &runtime-env-files
  - path: .env
    required: false
  - path: .env.local
    required: false

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: ${NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_LOGS_ENABLED: ${NEXT_PUBLIC_SENTRY_LOGS_ENABLED:-true}
        NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE:-}
        NEXT_PUBLIC_SENTRY_REPLAYS_ERROR_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_REPLAYS_ERROR_SAMPLE_RATE:-}
    image: bugtriage-ai:local
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: *runtime-env-files
    environment: *runtime-environment
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(4000) }).then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: bugtriage-ai:local
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    command: ["node", "--conditions=react-server", "--import", "tsx", "src/workers/bug-analysis.worker.ts"]
    env_file: *runtime-env-files
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  republisher:
    image: bugtriage-ai:local
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    command: ["node", "--conditions=react-server", "--import", "tsx", "src/workers/ticket-analysis-republisher.ts", "--watch"]
    env_file: *runtime-env-files
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: bugtriage-ai:local
    init: true
    restart: "no"
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    env_file: *runtime-env-files
    environment: *runtime-environment

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - bugtriage-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bugtriage-redis-data:
